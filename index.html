/* ---------- Editor mappa dell'area ---------- */
function spezzaTesto(ctx, testo, maxW) {
  const righe = [];
  String(testo).split("\n").forEach(par => {
    const parole = par.split(/\s+/).filter(Boolean);
    if (!parole.length) { righe.push(""); return; }
    let riga = parole[0];
    for (let i = 1; i < parole.length; i++) {
      const prova = riga + " " + parole[i];
      if (ctx.measureText(prova).width <= maxW) riga = prova;
      else { righe.push(riga); riga = parole[i]; }
    }
    righe.push(riga);
  });
  return righe;
}

function testoAdattato(ctx, testo, maxW, maxH, fontIniziale, peso) {
  let fs = fontIniziale, righe;
  for (;;) {
    ctx.font = peso + " " + fs + "px 'IBM Plex Sans', sans-serif";
    righe = spezzaTesto(ctx, testo, maxW);
    const sfora = righe.some(r => ctx.measureText(r).width > maxW);
    if ((!sfora && righe.length * fs * 1.15 <= maxH) || fs <= 9) break;
    fs -= 1;
  }
  return { righe, fs };
}

function raggio(f) { return f.tipo === "cerchio" ? Math.min(f.w, f.h) / 2 : (f.tipo === "zona" ? 10 : Math.min(f.h / 2, 20)); }

function MappaView({ mappa, sfondo, isAdmin, onSalva, onSfondo, log, mostra, mobile }) {
  const sfondoAttivo = sfondo || SFONDO_DEFAULT;
  const H = Math.round(MAPPA_W / (sfondo ? (mappa.ratio || MAPPA_RATIO_DEF) : MAPPA_RATIO_DEF));
  const [F, setF] = useState(mappa.forme || []);
  const [sel, setSel] = useState(null);
  const [zoom, setZoom] = useState(() => (window.innerWidth <= 760 ? 0.24 : 0.55));
  const wrapRef = useRef(null);
  const planRef = useRef(null);
  const drag = useRef(null);
  const Fref = useRef(F);
  Fref.current = F;

  useEffect(() => { if (!drag.current) setF(mappa.forme || []); }, [mappa]);

  // Adatta la mappa alla larghezza disponibile all'apertura e quando cambia la cartina
  useEffect(() => {
    const t = setTimeout(() => {
      const el = wrapRef.current;
      if (el) setZoom(+Math.min((el.clientWidth - 18) / MAPPA_W, (el.clientHeight - 18) / H).toFixed(3));
    }, 60);
    return () => clearTimeout(t);
  }, [mappa.ratio, sfondo]);

  const selezionata = F.find(f => f.id === sel);
  const commit = (next) => { setF(next); onSalva(next); };
  const aggiorna = (id, patch, salva) => {
    const next = F.map(f => (f.id === id ? { ...f, ...patch } : f));
    setF(next);
    if (salva) onSalva(next);
  };

  const adatta = () => {
    const el = wrapRef.current; if (!el) return;
    setZoom(+Math.min((el.clientWidth - 18) / MAPPA_W, (el.clientHeight - 18) / H).toFixed(3));
  };

  const aggiungi = (tipo) => {
    const base = FORME_NUOVE[tipo];
    const f = { ...base, id: uid(), x: Math.round(MAPPA_W / 2 - base.w / 2), y: Math.round(H / 2 - base.h / 2) };
    commit([...F, f]);
    setSel(f.id);
    log("ha aggiunto una forma alla mappa dell'area");
  };

  const duplica = () => {
    if (!selezionata) return;
    const f = { ...selezionata, id: uid(), x: selezionata.x + 30, y: selezionata.y + 30 };
    commit([...F, f]); setSel(f.id);
  };

  const elimina = () => {
    if (!selezionata) return;
    commit(F.filter(f => f.id !== sel)); setSel(null);
    log("ha rimosso una forma dalla mappa dell'area");
  };

  /* --- Trascinamento e ridimensionamento --- */
  const giu = (e, f, modo) => {
    if (!isAdmin) return;
    e.preventDefault(); e.stopPropagation();
    const r = planRef.current.getBoundingClientRect();
    drag.current = {
      id: f.id, modo,
      px: (e.clientX - r.left) / zoom, py: (e.clientY - r.top) / zoom,
      x: f.x, y: f.y, w: f.w, h: f.h, mosso: false
    };
    setSel(f.id);
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const muovi = (e) => {
    const d = drag.current; if (!d) return;
    const r = planRef.current.getBoundingClientRect();
    const cx = (e.clientX - r.left) / zoom, cy = (e.clientY - r.top) / zoom;
    const dx = cx - d.px, dy = cy - d.py;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) d.mosso = true;
    if (d.modo === "move") aggiorna(d.id, { x: Math.round(d.x + dx), y: Math.round(d.y + dy) });
    else aggiorna(d.id, { w: Math.max(30, Math.round(d.w + dx)), h: Math.max(30, Math.round(d.h + dy)) });
  };
  const su = () => {
    if (drag.current && drag.current.mosso) onSalva(Fref.current);
    drag.current = null;
  };

  /* --- Caricamento immagine di sfondo --- */
  const caricaSfondo = (file) => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scala = Math.min(1, 1600 / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scala); c.height = Math.round(img.height * scala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = 0.72, url = c.toDataURL("image/jpeg", q);
        while (url.length > 700000 && q > 0.3) { q -= 0.08; url = c.toDataURL("image/jpeg", q); }
        if (url.length > 900000) return mostra("Immagine troppo pesante: riducila e riprova");
        onSfondo(url);
        onSalva(Fref.current, img.width / img.height);
        log("ha caricato la cartina dell'area");
        mostra("Cartina caricata");
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  };

  /* --- Disegno su canvas per l'esportazione --- */
  const rettArrotondato = (ctx, x, y, w, h, r) => {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  };

  const disegnaForma = (ctx, f) => {
    const col = colore(f.colore);
    ctx.save();
    ctx.translate(f.x + f.w / 2, f.y + f.h / 2);
    ctx.rotate((f.rot || 0) * Math.PI / 180);
    const w = f.w, h = f.h;
    if (f.tipo === "zona") {
      ctx.globalAlpha = 0.35; ctx.fillStyle = col.bg;
      rettArrotondato(ctx, -w / 2, -h / 2, w, h, 10); ctx.fill();
      ctx.globalAlpha = 1; ctx.setLineDash([12, 9]); ctx.lineWidth = 3; ctx.strokeStyle = col.bg;
      rettArrotondato(ctx, -w / 2, -h / 2, w, h, 10); ctx.stroke(); ctx.setLineDash([]);
      if (f.testo) {
        ctx.fillStyle = col.bg; ctx.textAlign = "left"; ctx.textBaseline = "top";
        const { righe, fs } = testoAdattato(ctx, f.testo, w - 24, h - 20, f.font || 22, "700");
        righe.forEach((r, i) => ctx.fillText(r, -w / 2 + 12, -h / 2 + 10 + i * fs * 1.2));
      }
    } else if (f.tipo === "freccia") {
      const p = Math.max(6, h * 0.18);
      ctx.strokeStyle = col.bg; ctx.fillStyle = col.bg; ctx.lineWidth = p; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2 - p * 2.2, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w / 2 - p * 2.6, -p * 1.7);
      ctx.lineTo(w / 2 - p * 2.6, p * 1.7);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = col.bg;
      if (f.tipo === "cerchio") { ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill(); }
      else { rettArrotondato(ctx, -w / 2, -h / 2, w, h, raggio(f)); ctx.fill(); }
      if (f.testo) {
        ctx.fillStyle = col.testo; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const larghezza = (f.tipo === "cerchio" ? w * 0.82 : w - 16);
        const { righe, fs } = testoAdattato(ctx, f.testo, larghezza, h - 6, f.font || 30, "800");
        const lh = fs * 1.15;
        righe.forEach((r, i) => ctx.fillText(r, 0, (i - (righe.length - 1) / 2) * lh));
      }
    }
    ctx.restore();
  };

  /* scala massima sicura: i browser mobili (Safari) rifiutano canvas oltre ~16,7 milioni di pixel */
  const scalaExport = (max) => Math.max(1, Math.min(max, Math.sqrt(15500000 / (MAPPA_W * H))));
  const caricaImg = (src) => new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
  const fontPronti = async () => { if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} } };

  /* conSfondo=false → solo le forme su fondo trasparente (livello sovrapposto nel PDF) */
  const componiCanvas = async (S = scalaExport(3), conSfondo = true) => {
    const c = document.createElement("canvas");
    c.width = Math.round(MAPPA_W * S); c.height = Math.round(H * S);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.scale(S, S);
    if (conSfondo) {
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, MAPPA_W, H);
      if (sfondoAttivo) {
        const img = await caricaImg(sfondoAttivo);
        if (img) {
          const s = Math.min(MAPPA_W / img.width, H / img.height);
          const w = img.width * s, h = img.height * s;
          ctx.drawImage(img, (MAPPA_W - w) / 2, (H - h) / 2, w, h);
        }
      }
    }
    await fontPronti();
    F.forEach(f => disegnaForma(ctx, f));
    return c;
  };

  const esportaPNG = async () => {
    const c = await componiCanvas(scalaExport(3), true);
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png");
    a.download = "mappa-vigilia.png";
    a.click();
    mostra("Immagine esportata");
  };

  /* PDF a due livelli: la cartina originale (senza ricompressione) + le forme ad alta risoluzione in PNG trasparente */
  const esportaPDF = async () => {
    if (!window.jspdf || !window.jspdf.jsPDF) { mostra("Libreria PDF non caricata: uso il PNG"); return esportaPNG(); }
    mostra("Preparo il PDF…");
    const orizz = MAPPA_W >= H;
    const pdf = new window.jspdf.jsPDF({ orientation: orizz ? "landscape" : "portrait", unit: "mm", format: "a4", compress: true });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 8;
    const s = Math.min((pw - 2 * m) / MAPPA_W, (ph - 2 * m) / H);
    const X = (pw - MAPPA_W * s) / 2, Y = (ph - H * s) / 2, W = MAPPA_W * s, Hh = H * s;
    pdf.setFillColor(255, 255, 255); pdf.rect(X, Y, W, Hh, "F");

    /* livello 1: cartina di sfondo */
    if (sfondoAttivo) {
      const img = await caricaImg(sfondoAttivo);
      if (img) {
        const k = Math.min(MAPPA_W / img.width, H / img.height);
        const bw = img.width * k * s, bh = img.height * k * s;
        const bx = X + (W - bw) / 2, by = Y + (Hh - bh) / 2;
        const tipo = /^data:image\/(jpeg|jpg)/i.test(sfondoAttivo) ? "JPEG" : (/^data:image\/png/i.test(sfondoAttivo) ? "PNG" : null);
        if (tipo) {
          /* immagine caricata: la metto così com'è, senza perdere qualità */
          pdf.addImage(sfondoAttivo, tipo, bx, by, bw, bh, "sfondo", "NONE");
        } else {
          /* sfondo vettoriale (SVG): lo rasterizzo ad alta risoluzione */
          const S = scalaExport(4);
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k * S); c.height = Math.round(img.height * k * S);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, c.width, c.height);
          pdf.addImage(c.toDataURL("image/png"), "PNG", bx, by, bw, bh, "sfondo", "FAST");
        }
      }
    }

    /* livello 2: forme, etichette e frecce (trasparenti) */
    const forme = await componiCanvas(scalaExport(4), false);
    pdf.addImage(forme.toDataURL("image/png"), "PNG", X, Y, W, Hh, "forme", "FAST");

    pdf.setFont("helvetica", "normal"); pdf.setFontSize(7); pdf.setTextColor(150);
    pdf.text("Vigilia di Natale — mappa dell'area · " + new Date().toLocaleDateString("it-IT"), m, ph - 3);
    pdf.save("mappa-vigilia.pdf");
    log("ha esportato la mappa dell'area in PDF");
    mostra("PDF esportato");
  };

  return (
    <div>
      <div className="plan-bar no-print">
        {isAdmin && (
          <div className="row" style={{ flex: "0 0 auto", gap: 6, flexWrap: "wrap" }}>
            <button className="btn sm" onClick={() => aggiungi("etichetta")}>+ Etichetta</button>
            <button className="btn ghost sm" onClick={() => aggiungi("cerchio")}>+ Cerchio</button>
            <button className="btn ghost sm" onClick={() => aggiungi("zona")}>+ Zona</button>
            <button className="btn ghost sm" onClick={() => aggiungi("freccia")}>+ Freccia</button>
          </div>
        )}
        <button className="btn ghost sm" onClick={() => setZoom(z => Math.max(0.1, +(z - 0.05).toFixed(3)))}>−</button>
        <span className="num" style={{ minWidth: 44, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
        <button className="btn ghost sm" onClick={() => setZoom(z => Math.min(1.4, +(z + 0.05).toFixed(3)))}>+</button>
        <button className="btn ghost sm" onClick={adatta}>Adatta</button>
        <div className="spacer" />
        <button className="btn sm" onClick={esportaPDF}>Esporta PDF</button>
        <button className="btn ghost sm" onClick={esportaPNG}>PNG</button>
      </div>

      <div className="mappa-wrap" ref={wrapRef}>
        <div className="scaler" style={{ width: Math.round(MAPPA_W * zoom), height: Math.round(H * zoom) }}>
        <div className="mappa" ref={planRef}
          style={{ width: MAPPA_W, height: H, transform: "scale(" + zoom + ")" }}
          onPointerMove={muovi} onPointerUp={su} onPointerCancel={su}
          onClick={() => { if (!drag.current) setSel(null); }}>
          <div className="mappa-bg" style={{ backgroundImage: "url(" + sfondoAttivo + ")" }} />
          {F.map(f => {
            const col = colore(f.colore);
            const zona = f.tipo === "zona";
            return (
              <div key={f.id}
                className={"forma" + (zona ? " zona" : "") + (sel === f.id ? " sel" : "")}
                style={{
                  left: f.x, top: f.y, width: f.w, height: f.h,
                  transform: "rotate(" + (f.rot || 0) + "deg)",
                  background: f.tipo === "freccia" ? "transparent" : (zona ? col.bg + "59" : col.bg),
                  border: zona ? "3px dashed " + col.bg : "none",
                  borderRadius: raggio(f),
                  color: zona ? col.bg : col.testo
                }}
                onPointerDown={e => giu(e, f, "move")}
                onClick={e => { e.stopPropagation(); setSel(f.id); }}>
                {f.tipo === "freccia" ? (
                  <svg width="100%" height="100%" viewBox="0 0 100 40" preserveAspectRatio="none">
                    <path d="M0 20 H72" stroke={col.bg} strokeWidth="9" strokeLinecap="round" />
                    <path d="M100 20 L68 4 L68 36 Z" fill={col.bg} />
                  </svg>
                ) : (
                  <span className="txt" style={{ fontSize: f.font || 30 }}>{f.testo}</span>
                )}
                {isAdmin && sel === f.id && (
                  <span className="maniglia" onPointerDown={e => giu(e, f, "resize")} />
                )}
              </div>
            );
          })}
        </div>
        </div>
      </div>

      {isAdmin && (
        <div className="split due" style={{ marginTop: 12 }}>
          <div className="panel no-print">
            <h2>Forma selezionata</h2>
            {!selezionata && <p className="hint">Tocca una forma sulla mappa per modificarla, oppure aggiungine una dai pulsanti in alto.</p>}
            {selezionata && (
              <div>
                {selezionata.tipo !== "freccia" && (
                  <div className="field"><label>Testo</label>
                    <input value={selezionata.testo}
                      onChange={e => aggiorna(sel, { testo: e.target.value })}
                      onBlur={() => onSalva(Fref.current)} /></div>
                )}
                <div className="tavolozza">
                  {COLORI.map(c => (
                    <button key={c.id} className={"pastiglia" + (selezionata.colore === c.id ? " on" : "")}
                      style={{ background: c.bg }} onClick={() => aggiorna(sel, { colore: c.id }, true)} />
                  ))}
                </div>
                <div className="prop"><label>Rotazione</label>
                  <input type="range" min="0" max="345" step="15" value={selezionata.rot || 0}
                    onChange={e => aggiorna(sel, { rot: parseInt(e.target.value) })}
                    onPointerUp={() => onSalva(Fref.current)} />
                  <span className="num">{selezionata.rot || 0}°</span></div>
                {selezionata.tipo !== "freccia" && (
                  <div className="prop"><label>Testo px</label>
                    <input type="range" min="12" max="80" step="1" value={selezionata.font || 30}
                      onChange={e => aggiorna(sel, { font: parseInt(e.target.value) })}
                      onPointerUp={() => onSalva(Fref.current)} />
                    <span className="num">{selezionata.font || 30}</span></div>
                )}
                <div className="row" style={{ marginTop: 10 }}>
                  <button className="btn ghost sm" onClick={duplica}>Duplica</button>
                  <button className="btn ghost sm" onClick={() => { commit([...F.filter(f => f.id !== sel), selezionata]); }}>Porta avanti</button>
                  <button className="btn danger sm" onClick={elimina}>Elimina</button>
                </div>
              </div>
            )}
          </div>

          <div className="panel no-print">
            <h2>Cartina di sfondo</h2>
            <p className="hint">L'app parte con la mappa stilizzata della piazza: contorni di edifici, alberi, strade e monumento, senza foto. Puoi sostituirla con una tua immagine — viene ridotta e salvata nel database, così la vedono tutti i dispositivi.</p>
            <input type="file" accept="image/*" style={{ marginTop: 10 }}
              onChange={e => { caricaSfondo(e.target.files && e.target.files[0]); e.target.value = ""; }} />
            {sfondo && (
              <button className="btn ghost sm" style={{ marginTop: 10 }}
                onClick={() => { if (confirm("Tornare alla mappa stilizzata della piazza?")) { onSfondo(""); log("ha ripristinato la cartina predefinita"); } }}>
                Torna alla mappa stilizzata
              </button>
            )}
            <p className="hint" style={{ marginTop: 12 }}>
              Forme sulla mappa: <b className="num">{F.length}</b>. L'esportazione PDF produce un A4 orizzontale con cartina e forme.
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   COSTI & RICAVI (budget, consuntivo, ripartizione) + Anagrafica
   ========================================================= */
function FinanzeView({ finanze, pronte, onSalva: salvaDoc, log, mostra }) {
  const voci = finanze.voci || [];
  const soggetti = finanze.soggetti || [];
  /* finché non sono state salvate, si usano le tre associazioni di partenza (senza scriverle subito nel database) */
  const enti = finanze.enti ? finanze.enti : ENTI_DEFAULT;
  const onSalva = (next) => salvaDoc({ ...next, enti: next.enti || enti });
  const [sotto, setSotto] = useState("voci");
  const [filtro, setFiltro] = useState("tutte");
  const [filtroEnte, setFiltroEnte] = useState("");
  const [modaleVoce, setModaleVoce] = useState(null);
  const [nuovoSoggetto, setNuovoSoggetto] = useState({ nome: "", tipo: "fornitore", contatto: "", retro: 100 });
  const [nuovoEnte, setNuovoEnte] = useState("");


  const nomeSoggetto = (id) => { const s = soggetti.find(x => x.id === id); return s ? s.nome : "—"; };
  const nomeEnte = (id) => { const e = enti.find(x => x.id === id); return e ? e.nome : "—"; };

  const R = useMemo(() => calcolaRipartizione(voci, enti), [voci, enti]);

  const listaVoci = useMemo(() => {
    let l = voci.slice();
    if (["costo", "ricavo", "prelievo", "fondo"].indexOf(filtro) >= 0) l = l.filter(v => (v.tipo || "costo") === filtro);
    if (filtro === "daconsuntivare") l = l.filter(v => v.consuntivo === null || v.consuntivo === undefined);
    if (filtroEnte) l = l.filter(v => (v.ente || "") === filtroEnte);
    return l.sort((a, b) => (b.creata || 0) - (a.creata || 0));
  }, [voci, filtro, filtroEnte]);

  const salvaVoce = (v) => {
    const dati = { ...v, ...firma() };
    const next = voci.some(x => x.id === dati.id)
      ? voci.map(x => (x.id === dati.id ? dati : x))
      : [...voci, { ...dati, id: dati.id || uid() }];
    onSalva({ ...finanze, voci: next });
    log((v.id ? "ha modificato la voce " : "ha inserito la voce ") + v.voce + " (" + tipoVoceLabel(v.tipo) + ")");
    setModaleVoce(null); mostra("Voce salvata");
  };
  const eliminaVoce = (id) => {
    const v = voci.find(x => x.id === id);
    onSalva({ ...finanze, voci: voci.filter(x => x.id !== id) });
    log("ha eliminato la voce " + (v ? v.voce : id));
    setModaleVoce(null); mostra("Voce eliminata");
  };

  const patchSoggetto = (id, patch, azione) => {
    onSalva({ ...finanze, soggetti: soggetti.map(s => (s.id === id ? { ...s, ...patch, ...firma() } : s)) });
    if (azione) log(azione);
  };
  const eliminaSoggetto = (id) => {
    const s = soggetti.find(x => x.id === id);
    if (voci.some(v => v.soggetto === id) && !confirm("Ci sono voci collegate a " + (s ? s.nome : "questa controparte") + ". Eliminarla comunque?")) return;
    onSalva({ ...finanze, soggetti: soggetti.filter(x => x.id !== id) });
    log("ha eliminato dall'anagrafica " + (s ? s.nome : id));
    mostra("Eliminato dall'anagrafica");
  };
  const aggiungiSoggetto = () => {
    const n = nuovoSoggetto.nome.trim(); if (!n) return;
    if (soggetti.some(s => s.nome.toLowerCase() === n.toLowerCase())) return mostra(n + " è già in anagrafica");
    const s = {
      id: uid(), nome: n, tipo: nuovoSoggetto.tipo, contatto: nuovoSoggetto.contatto.trim(), note: "",
      retro: nuovoSoggetto.tipo === "attivita" ? (parseFloat(nuovoSoggetto.retro) || 0) : 100, ...firma()
    };
    onSalva({ ...finanze, soggetti: [...soggetti, s] });
    log("ha aggiunto in anagrafica " + n);
    setNuovoSoggetto({ nome: "", tipo: "fornitore", contatto: "", retro: 100 });
    mostra("Aggiunto all'anagrafica");
  };

  const patchEnte = (id, patch, azione) => {
    onSalva({ ...finanze, enti: enti.map(e => (e.id === id ? { ...e, ...patch } : e)) });
    if (azione) log(azione);
  };
  const aggiungiEnte = () => {
    const n = nuovoEnte.trim(); if (!n) return;
    if (enti.some(e => e.nome.toLowerCase() === n.toLowerCase())) return mostra(n + " c'è già");
    const quota = +(100 / (enti.length + 1)).toFixed(2);
    const next = enti.map((e, i) => ({ ...e, quota: i === 0 ? +(100 - quota * enti.length).toFixed(2) : quota })).concat([{ id: uid(), nome: n, quota }]);
    onSalva({ ...finanze, enti: next });
    log("ha aggiunto l'associazione " + n);
    setNuovoEnte(""); mostra("Associazione aggiunta");
  };
  const eliminaEnte = (id) => {
    const e = enti.find(x => x.id === id);
    if (voci.some(v => v.ente === id) && !confirm("Ci sono voci intestate a " + (e ? e.nome : "questa associazione") + ". Eliminarla comunque?")) return;
    onSalva({ ...finanze, enti: enti.filter(x => x.id !== id) });
    log("ha eliminato l'associazione " + (e ? e.nome : id));
  };
  const quoteParitarie = () => {
    if (!enti.length) return;
    const q = +(100 / enti.length).toFixed(2);
    const next = enti.map((e, i) => ({ ...e, quota: i === 0 ? +(100 - q * (enti.length - 1)).toFixed(2) : q }));
    onSalva({ ...finanze, enti: next });
    log("ha messo le quote in parti uguali");
    mostra("Quote in parti uguali");
  };

  /* ---------- Esportazioni ---------- */
  const righeDettaglio = () => {
    const h = ["Tipo", "Voce", "Associazione", "Controparte", "Preventivo", "Consuntivo", "Importo usato",
      "% alle associazioni", "Netto associazioni", "Da girare", "Ripartita", "Data", "Note"];
    const r = voci.slice().sort((a, b) => String(a.tipo).localeCompare(String(b.tipo)) || String(a.voce).localeCompare(String(b.voce), "it")).map(v => {
      const imp = importoVoce(v), q = quotaAssoc(v);
      const netto = v.tipo === "ricavo" ? imp * q / 100 : imp;
      const et = (TIPI_VOCE.find(t => t.id === (v.tipo || "costo")) || TIPI_VOCE[0]).label + (fondoRestituito(v) ? " (restituito)" : "") + (fondoNegliIncassi(v) || ricavoNegliIncassi(v) ? " (già nelle casse)" : "");
      return [et, v.voce, nomeEnte(v.ente), nomeSoggetto(v.soggetto),
        Number(v.preventivo) || 0, (v.consuntivo === null || v.consuntivo === undefined) ? "" : Number(v.consuntivo) || 0,
        imp, v.tipo === "ricavo" ? q : 100, +netto.toFixed(2), v.tipo === "ricavo" ? +(imp - netto).toFixed(2) : 0,
        v.ripartita === false ? "no" : "sì", v.data || "", v.note || ""];
    });
    return [h].concat(r);
  };
  const righeEnti = () => {
    const h = ["Associazione", "Incassato lordo", "Prelievi in natura", "Da girare alle attività", "Costi pagati", "Disponibile",
      "Fondo cassa da restituire", "Quota %", "Spettante", "Conguaglio", "Voci proprie (non ripartite)"];
    const r = R.enti.map(e => [e.ente.nome, +e.incassi.toFixed(2), +e.prelievi.toFixed(2), +e.daGirare.toFixed(2), +e.costi.toFixed(2),
      +e.disponibile.toFixed(2), +e.fondi.toFixed(2), Number(e.ente.quota) || 0, +e.spettante.toFixed(2), +e.conguaglio.toFixed(2), +e.propri.toFixed(2)]);
    return [h].concat(r);
  };
  const righeControparti = () => {
    const h = ["Controparte", "Tipo", "Incassato lordo", "% alle associazioni", "Da girare a loro", "Costi verso di loro", "Saldo (a loro favore)"];
    const r = R.controparti.map(c => {
      const s = soggetti.find(x => x.id === c.id);
      return [s ? s.nome : "(senza controparte)", s ? tipoSoggettoLabel(s.tipo) : "—", +c.incassato.toFixed(2),
        c.incassato ? +(100 - c.daGirare / c.incassato * 100).toFixed(2) : "", +c.daGirare.toFixed(2), +c.costi.toFixed(2),
        +(c.daGirare + c.costi).toFixed(2)];
    });
    return [h].concat(r);
  };
  const righeRiepilogo = () => ([
    ["Riepilogo Vigilia di Natale", ""],
    ["Aggiornato al", new Date().toLocaleString("it-IT")],
    ["", ""],
    ["Incasso lordo (casse e POS)", +R.ricaviLordi.toFixed(2)],
    ["Fondo cassa compreso negli incassi", +R.fondoIncassi.toFixed(2)],
    ["Quota delle attività commerciali", +R.girate.toFixed(2)],
    ["Incasso delle associazioni", +R.incassoAssoc.toFixed(2)],
    ["Merce tenuta dalle associazioni (prelievi)", +R.prelievi.toFixed(2)],
    ["Costi", +R.costi.toFixed(2)],
    ["Risultato da ripartire", +R.risultato.toFixed(2)],
    ["", ""],
    ["Fondi cassa anticipati, da restituire", +R.fondi.toFixed(2)],
    ["Fondi cassa già restituiti", +R.fondiRestituiti.toFixed(2)],
    ["Voci non ripartite (di singole associazioni)", +R.propri.toFixed(2)],
    ["Voci senza associazione", R.senzaEnte],
    ["Voci ancora da consuntivare", R.daConsuntivare]
  ]);

  const esportaExcel = () => {
    if (!window.XLSX) return mostra("Libreria Excel non disponibile");
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(righeRiepilogo()), "Riepilogo");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(righeEnti()), "Ripartizione");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(righeControparti()), "Controparti");
    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(righeDettaglio()), "Dettaglio");
    window.XLSX.writeFile(wb, "costi-ricavi-vigilia.xlsx");
    log("ha esportato costi, ricavi e ripartizione in Excel");
    mostra("Excel esportato");
  };

  const esportaPdf = () => {
    if (!window.jspdf || !window.jspdf.jsPDF) return mostra("Libreria PDF non disponibile");
    const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4", compress: true });
    if (typeof pdf.autoTable !== "function") return mostra("Modulo tabelle PDF non caricato: ricarica la pagina");
    const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight(), M = 12;
    const ACC = [192, 118, 26], INK = [28, 26, 34], GRIGIO = [120, 116, 128], VERDE = [27, 135, 100], ROSSO = [190, 55, 72];
    const pct = (n) => (Number(n) || 0).toLocaleString("it-IT", { maximumFractionDigits: 2 }) + "%";
    const stampato = new Date().toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
    const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
    let y = M;

    /* --- intestazione --- */
    pdf.setFillColor(...ACC); pdf.rect(0, 0, PW, 3, "F");
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(18); pdf.setTextColor(...INK);
    pdf.text("Vigilia di Natale", M, y + 7);
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(12); pdf.setTextColor(...GRIGIO);
    pdf.text("Costi, ricavi e ripartizione fra le associazioni", M, y + 13);
    pdf.setFontSize(8.5);
    pdf.text("Stampato il " + stampato, PW - M, y + 7, { align: "right" });
    pdf.text("Importi consuntivi dove presenti, altrimenti preventivi", PW - M, y + 12, { align: "right" });
    y += 19;

    /* --- riquadri chiave --- */
    const kpi = [
      ["Ricavi netti", R.ricaviNetti, INK],
      ["Costi", R.costi, INK],
      ["Risultato da ripartire", R.risultato, R.risultato >= 0 ? VERDE : ROSSO],
      ["Fondi cassa da restituire", R.fondi, INK]
    ];
    const gap = 4, kw = (PW - 2 * M - gap * (kpi.length - 1)) / kpi.length, kh = 16;
    kpi.forEach(([lab, val, col], i) => {
      const x = M + i * (kw + gap);
      pdf.setFillColor(248, 245, 239); pdf.setDrawColor(225, 218, 205); pdf.setLineWidth(0.2);
      pdf.roundedRect(x, y, kw, kh, 2, 2, "FD");
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(7.5); pdf.setTextColor(...GRIGIO);
      pdf.text(lab.toUpperCase(), x + 4, y + 5.5);
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(13); pdf.setTextColor(...col);
      pdf.text(euro(val), x + 4, y + 12.5);
    });
    y += kh + 5;

    /* --- controlli di quadratura --- */
    const sommaCong = round2(R.enti.reduce((t, e) => t + e.conguaglio, 0));
    const avvisi = [];
    if (R.enti.length && R.quotaTot !== 100) avvisi.push("Le quote sommano " + pct(R.quotaTot) + " invece di 100%: la ripartizione non quadra.");
    if (R.senzaEnte > 0) avvisi.push(R.senzaEnte + (R.senzaEnte === 1 ? " voce non è intestata" : " voci non sono intestate") + " a nessuna associazione: entrano nel risultato ma non nella cassa di nessuno.");
    if (Math.abs(sommaCong) >= 0.01) avvisi.push("La somma dei conguagli è " + euro(sommaCong) + " (dovrebbe essere zero).");
    if (R.daConsuntivare > 0) avvisi.push(R.daConsuntivare + (R.daConsuntivare === 1 ? " voce è" : " voci sono") + " ancora a preventivo: i numeri sono provvisori.");
    if (avvisi.length) {
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5);
      const righe = avvisi.flatMap(a => pdf.splitTextToSize("•  " + a, PW - 2 * M - 8));
      const h = righe.length * 4 + 5;
      pdf.setFillColor(253, 243, 230); pdf.setDrawColor(...ACC); pdf.setLineWidth(0.3);
      pdf.roundedRect(M, y, PW - 2 * M, h, 1.5, 1.5, "FD");
      pdf.setTextColor(120, 70, 10);
      righe.forEach((r, i) => pdf.text(r, M + 4, y + 5 + i * 4));
      y += h + 5;
    } else {
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...VERDE);
      pdf.text("Quadratura ok: quote al 100%, tutte le voci intestate, conguagli a somma zero.", M, y + 1);
      y += 6;
    }

    /* --- stile comune tabelle --- */
    const base = {
      theme: "grid",
      margin: { left: M, right: M, top: M + 4, bottom: 14 },
      styles: { font: "helvetica", fontSize: 8.5, cellPadding: { top: 1.8, bottom: 1.8, left: 2, right: 2 }, textColor: INK, lineColor: [228, 222, 210], lineWidth: 0.15, valign: "middle", overflow: "linebreak" },
      headStyles: { fillColor: [44, 40, 54], textColor: 255, fontStyle: "bold", fontSize: 7.8, valign: "bottom" },
      footStyles: { fillColor: [240, 235, 225], textColor: INK, fontStyle: "bold" },
      alternateRowStyles: { fillColor: [250, 248, 244] },
      showFoot: "lastPage"
    };
    const titoloSezione = (t, nota) => {
      if (y > PH - 40) { pdf.addPage(); y = M + 4; }
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(12.5); pdf.setTextColor(...INK);
      pdf.text(t, M, y);
      if (nota) { pdf.setFont("helvetica", "normal"); pdf.setFontSize(8); pdf.setTextColor(...GRIGIO); pdf.text(nota, M, y + 4.2); }
      y += nota ? 7 : 3.5;
    };
    const dopo = () => { y = pdf.lastAutoTable.finalY + 9; };
    const num = (n) => euro(n);

    /* --- 1. Ripartizione --- */
    titoloSezione("Ripartizione fra le associazioni", "Conguaglio positivo = l'associazione deve ricevere · negativo = deve versare");
    const tot = (k) => R.enti.reduce((t, e) => t + (Number(e[k]) || 0), 0);
    pdf.autoTable({
      ...base, startY: y,
      head: [["Associazione", "Quota", "Incassato lordo", "Prelievi in natura", "Da girare alle attività", "Costi pagati", "Disponibile", "Fondo cassa anticipato", "Spettante", "Conguaglio", "Voci proprie"]],
      body: R.enti.map(e => [e.ente.nome, pct(e.ente.quota), num(e.incassi), num(e.prelievi), num(e.daGirare), num(e.costi),
        num(e.disponibile), num(e.fondi), num(e.spettante), num(e.conguaglio), e.propri ? num(e.propri) : "—"]),
      foot: [["Totale", pct(R.quotaTot), num(tot("incassi")), num(tot("prelievi")), num(tot("daGirare")), num(tot("costi")),
        num(tot("disponibile")), num(tot("fondi")), num(tot("spettante")), num(sommaCong), num(tot("propri"))]],
      columnStyles: { 0: { cellWidth: 38, fontStyle: "bold" }, 1: { halign: "right", cellWidth: 16 }, ...Object.fromEntries([2, 3, 4, 5, 6, 7, 8, 9, 10].map(i => [i, { halign: "right" }])) },
      didParseCell: (d) => {
        if (d.section !== "head" && d.column.index > 0) d.cell.styles.halign = "right";
        if (d.section === "body" && d.column.index === 9) {
          const v = R.enti[d.row.index].conguaglio;
          d.cell.styles.fontStyle = "bold";
          d.cell.styles.textColor = Math.abs(v) < 0.005 ? INK : (v > 0 ? VERDE : ROSSO);
        }
      }
    });
    dopo();

    /* --- 2. Chi versa a chi (pareggio dei conguagli) --- */
    const giri = calcolaVersamenti(R.enti).map(g => [g.da, g.a, num(g.importo)]);
    if (giri.length) {
      titoloSezione("Versamenti per chiudere i conti", "Proposta con il minor numero di bonifici; i fondi cassa anticipati sono già compresi");
      pdf.autoTable({
        ...base, startY: y, tableWidth: 150,
        head: [["Chi versa", "A chi", "Importo"]],
        body: giri,
        columnStyles: { 2: { halign: "right", fontStyle: "bold" } },
        didParseCell: (d) => { if (d.section === "head" && d.column.index === 2) d.cell.styles.halign = "right"; }
      });
      dopo();
    }

    /* --- 3. Riepilogo --- */
    titoloSezione("Riepilogo");
    pdf.autoTable({
      ...base, startY: y, tableWidth: 150,
      head: [["Voce", "Importo"]],
      body: [
        ["Incasso lordo (casse e POS)", num(R.ricaviLordi)],
        ["  meno fondo cassa compreso negli incassi", num(R.fondoIncassi)],
        ["  meno quota delle attività commerciali", num(R.girate)],
        ["Incasso delle associazioni", num(R.incassoAssoc)],
        ["  più merce tenuta dalle associazioni (prelievi)", num(R.prelievi)],
        ["Costi", num(R.costi)],
        ["Risultato da ripartire", num(R.risultato)],
        ["Fondi cassa anticipati, da restituire", num(R.fondi)],
        ["Fondi cassa già restituiti", num(R.fondiRestituiti)],
        ["Voci non ripartite (di singole associazioni)", num(R.propri)],
        ["Voci senza associazione", String(R.senzaEnte)],
        ["Voci ancora da consuntivare", String(R.daConsuntivare)]
      ],
      columnStyles: { 1: { halign: "right" } },
      didParseCell: (d) => {
        if (d.section === "head" && d.column.index === 1) d.cell.styles.halign = "right";
        if (d.section === "body" && (d.row.index === 6 || d.row.index === 3)) { d.cell.styles.fontStyle = "bold"; d.cell.styles.fillColor = [240, 235, 225]; }
        if (d.section === "body" && d.column.index === 0 && String(d.cell.raw).startsWith("  ")) d.cell.styles.textColor = GRIGIO;
      }
    });
    dopo();

    /* --- 3-bis. Scorporo attività commerciali --- */
    if (R.attivita.length) {
      titoloSezione("Attività commerciali: scorporo", "Venduto, quota girata alle attività e quota che resta alle associazioni");
      pdf.autoTable({
        ...base, startY: y, tableWidth: 190,
        head: [["Attività", "Venduto", "Alle attività", "Alle associazioni"]],
        body: R.attivita.map(a => [a.id ? nomeSoggetto(a.id) : "(senza controparte)", num(a.venduto), num(a.aLoro), num(a.aNoi)]),
        foot: [["Totale", num(R.attivita.reduce((t, a) => t + a.venduto, 0)), num(R.attivita.reduce((t, a) => t + a.aLoro, 0)), num(R.attivita.reduce((t, a) => t + a.aNoi, 0))]],
        didParseCell: (d) => { if (d.column.index >= 1) d.cell.styles.halign = "right"; }
      });
      dopo();
    }

    /* --- 4. Controparti --- */
    const cp = righeControparti().slice(1);
    if (cp.length) {
      titoloSezione("Controparti", "Importi verso fornitori, attività e altri soggetti");
      pdf.autoTable({
        ...base, startY: y,
        head: [["Controparte", "Tipo", "Incassato lordo", "% alle associazioni", "Da girare a loro", "Costi verso di loro", "Totale verso di loro"]],
        body: cp.map(r => [r[0], r[1], num(r[2]), r[3] === "" ? "—" : pct(r[3]), num(r[4]), num(r[5]), num(r[6])]),
        foot: [["Totale", "", num(cp.reduce((t, r) => t + r[2], 0)), "", num(cp.reduce((t, r) => t + r[4], 0)), num(cp.reduce((t, r) => t + r[5], 0)), num(cp.reduce((t, r) => t + r[6], 0))]],
        columnStyles: { 0: { cellWidth: 60, fontStyle: "bold" }, 1: { cellWidth: 32 } },
        didParseCell: (d) => { if (d.column.index >= 2) d.cell.styles.halign = "right"; }
      });
      dopo();
    }

    /* --- 5. Dettaglio voci --- */
    const det = righeDettaglio().slice(1);
    titoloSezione("Dettaglio voci", det.length + (det.length === 1 ? " voce" : " voci"));
    pdf.autoTable({
      ...base, startY: y,
      styles: { ...base.styles, fontSize: 7.8 },
      head: [["Tipo", "Voce", "Associazione", "Controparte", "Preventivo", "Consuntivo", "Importo usato", "% assoc.", "Netto assoc.", "Da girare", "Rip.", "Note"]],
      body: det.map(r => [r[0], r[1], r[2], r[3], num(r[4]), r[5] === "" ? "da fare" : num(r[5]), num(r[6]),
        r[0].startsWith("Ricavo") ? pct(r[7]) : "", num(r[8]), r[9] ? num(r[9]) : "", r[10], [r[11], r[12]].filter(Boolean).join(" · ")]),
      columnStyles: {
        0: { cellWidth: 20 }, 1: { cellWidth: 44, fontStyle: "bold" }, 2: { cellWidth: 26 }, 3: { cellWidth: 28 },
        4: { cellWidth: 21 }, 5: { cellWidth: 21 }, 6: { cellWidth: 21 }, 7: { cellWidth: 14 }, 8: { cellWidth: 21 }, 9: { cellWidth: 19 }, 10: { cellWidth: 9, halign: "center" }
      },
      didParseCell: (d) => {
        if ([4, 5, 6, 7, 8, 9].includes(d.column.index)) d.cell.styles.halign = "right";
        if (d.section === "body" && d.column.index === 5 && d.cell.raw === "da fare") { d.cell.styles.textColor = ACC; d.cell.styles.fontStyle = "italic"; }
        if (d.section === "body" && d.column.index === 10 && d.cell.raw === "no") d.cell.styles.textColor = ROSSO;
      }
    });

    /* --- piè di pagina --- */
    const n = pdf.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      pdf.setPage(p);
      pdf.setDrawColor(225, 218, 205); pdf.setLineWidth(0.2); pdf.line(M, PH - 9, PW - M, PH - 9);
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(7.5); pdf.setTextColor(150);
      pdf.text("Vigilia di Natale — costi, ricavi e ripartizione · " + stampato, M, PH - 5.5);
      pdf.text("Pagina " + p + " di " + n, PW - M, PH - 5.5, { align: "right" });
    }
    pdf.save("costi-ricavi-vigilia.pdf");
    log("ha esportato il PDF di costi, ricavi e ripartizione");
    mostra("PDF esportato");
  };

  const versamenti = useMemo(() => calcolaVersamenti(R.enti), [R]);

  if (!pronte) return <div style={{ padding: 40 }} className="hint">Carico costi e ricavi…</div>;

  return (
    <div style={{ marginTop: 16 }}>
      <div className="stats" style={{ marginBottom: 14 }}>
        <div className="stat ok"><b className="num">{euro(R.ricaviNetti)}</b><i>ricavi netti</i></div>
        <div className="stat bad"><b className="num">{euro(R.costi)}</b><i>costi</i></div>
        <div className={"stat " + (R.risultato >= 0 ? "ok" : "bad")}><b className="num">{euro(R.risultato)}</b><i>da ripartire</i></div>
        <div className="stat warn"><b className="num">{euro(R.girate)}</b><i>alle attività</i></div>
        {R.fondi > 0 && <div className="stat warn"><b className="num">{euro(R.fondi)}</b><i>fondo cassa</i></div>}
        <div className={"stat " + (R.daConsuntivare > 0 ? "warn" : "")}><b className="num">{R.daConsuntivare}</b><i>da consuntivare</i></div>
        {R.senzaEnte > 0 && <div className="stat bad"><b className="num">{R.senzaEnte}</b><i>senza associazione</i></div>}
      </div>

      <div className="segcaps">
        <button className={sotto === "voci" ? "on" : ""} onClick={() => setSotto("voci")}>Costi & ricavi</button>
        <button className={sotto === "ripartizione" ? "on" : ""} onClick={() => setSotto("ripartizione")}>Ripartizione</button>
        <button className={sotto === "anagrafica" ? "on" : ""} onClick={() => setSotto("anagrafica")}>Controparti</button>
        <button className={sotto === "enti" ? "on" : ""} onClick={() => setSotto("enti")}>Associazioni</button>
        <div className="spacer" />
        <button className="btn sm" onClick={esportaPdf}>PDF</button>
        <button className="btn ghost sm" onClick={esportaExcel}>Excel</button>
      </div>

      {sotto === "voci" && (
        <div className="panel">
          <div className="filtri">
            {[["tutte", "Tutte"], ["ricavo", "Ricavi"], ["costo", "Costi"], ["prelievo", "Prelievi"], ["fondo", "Fondo cassa"], ["daconsuntivare", "Da consuntivare"]].map(([k, l]) => (
              <button key={k} className={"chip" + (filtro === k ? " on" : "")} onClick={() => setFiltro(k)}>{l}</button>
            ))}
            <select value={filtroEnte} onChange={e => setFiltroEnte(e.target.value)} style={{ width: 190 }}>
              <option value="">Tutte le associazioni</option>
              {enti.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
            </select>
          </div>
          <div className="row" style={{ marginBottom: 10 }}>
            <button className="btn sm" onClick={() => setModaleVoce({})}>+ Voce</button>
          </div>
          {listaVoci.length === 0 && <p className="hint">Nessuna voce. Aggiungine una con "+ Voce".</p>}
          {listaVoci.length > 0 && (
            <table className="tab-cards">
              <thead><tr><th>Voce</th><th>Associazione</th><th>Controparte</th><th>Preventivo</th><th>Consuntivo</th></tr></thead>
              <tbody>
                {listaVoci.map(v => {
                  const q = quotaAssoc(v);
                  return (
                    <tr key={v.id} className="fin-riga" onClick={() => setModaleVoce(v)}>
                      <td data-label="Voce">
                        <span className={"tag " + (v.tipo || "costo")}>{tipoVoceLabel(v.tipo)}</span>
                        <div className="fin-cat">{v.voce}</div>
                        <div className="fin-sub">
                          {v.data ? v.data + " · " : ""}
                          {v.tipo === "ricavo" && q < 100 ? "alle associazioni " + q + "%" : ""}
                          {v.tipo === "fondo" ? (fondoRestituito(v) ? "già restituito" : "da restituire" + (v.presso && v.presso !== v.ente ? " · in cassa a " + nomeEnte(v.presso) : "") + (fondoNegliIncassi(v) ? " · già nelle casse" : "")) : ""}
                          {ricavoNegliIncassi(v) ? " · venduto già nelle casse" : ""}
                          {v.ripartita === false && v.tipo !== "fondo" ? "non ripartita" : ""}
                        </div>
                      </td>
                      <td data-label="Associazione">{v.ente ? nomeEnte(v.ente) : <span className="imp muted">da assegnare</span>}</td>
                      <td data-label="Controparte">{nomeSoggetto(v.soggetto)}</td>
                      <td data-label="Preventivo" className="num">{euro(v.preventivo)}</td>
                      <td data-label="Consuntivo" className="num">
                        {(v.consuntivo === null || v.consuntivo === undefined) ? <span className="imp muted">—</span> : euro(v.consuntivo)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      )}

      {sotto === "ripartizione" && (
        <div>
          <div className="panel">
            <h2>Come si chiude</h2>
            <table className="tab-cards">
              <tbody>
                <tr><td data-label="Voce">Incasso lordo (casse e POS)</td><td className="num" data-label="Importo">{euro(R.ricaviLordi)}</td></tr>
                {R.fondoIncassi > 0 && <tr><td data-label="Voce">Fondo cassa compreso negli incassi</td><td className="num imp neg" data-label="Importo">− {euro(R.fondoIncassi)}</td></tr>}
                <tr><td data-label="Voce">Quota delle attività commerciali</td><td className="num imp neg" data-label="Importo">− {euro(R.girate)}</td></tr>
                <tr><td data-label="Voce"><b>Incasso delle associazioni</b></td><td className="num imp pos" data-label="Importo"><b>{euro(R.incassoAssoc)}</b></td></tr>
                {R.prelievi > 0 && <tr><td data-label="Voce">Merce tenuta dalle associazioni (prelievi)</td><td className="num" data-label="Importo">+ {euro(R.prelievi)}</td></tr>}
                <tr><td data-label="Voce">Costi</td><td className="num imp neg" data-label="Importo">− {euro(R.costi)}</td></tr>
                <tr><td data-label="Voce"><b>Risultato da ripartire</b></td><td className={"num imp " + (R.risultato >= 0 ? "pos" : "neg")} data-label="Importo"><b>{euro(R.risultato)}</b></td></tr>
                {R.fondi > 0 && <tr><td data-label="Voce">Fondo cassa da restituire (fuori dal risultato)</td><td className="num" data-label="Importo">{euro(R.fondi)}</td></tr>}
              </tbody>
            </table>
          </div>

          {R.attivita.length > 0 && (
            <div className="panel">
              <h2>Attività commerciali: scorporo</h2>
              <p className="hint">Quanto hanno venduto le attività, quanto va girato a loro e quanto resta alle associazioni.</p>
              <table className="tab-cards">
                <thead><tr><th>Attività</th><th>Venduto</th><th>Alle attività</th><th>Alle associazioni</th></tr></thead>
                <tbody>
                  {R.attivita.map(a => (
                    <tr key={a.id || "nessuno"}>
                      <td data-label="Attività"><b>{a.id ? nomeSoggetto(a.id) : "(senza controparte)"}</b></td>
                      <td className="num" data-label="Venduto">{euro(a.venduto)}</td>
                      <td className="num imp neg" data-label="Alle attività">{euro(a.aLoro)}</td>
                      <td className="num imp pos" data-label="Alle associazioni">{euro(a.aNoi)}</td>
                    </tr>
                  ))}
                  <tr>
                    <td data-label="Attività"><b>Totale</b></td>
                    <td className="num" data-label="Venduto"><b>{euro(R.attivita.reduce((t, a) => t + a.venduto, 0))}</b></td>
                    <td className="num imp neg" data-label="Alle attività"><b>{euro(R.attivita.reduce((t, a) => t + a.aLoro, 0))}</b></td>
                    <td className="num imp pos" data-label="Alle associazioni"><b>{euro(R.attivita.reduce((t, a) => t + a.aNoi, 0))}</b></td>
                  </tr>
                </tbody>
              </table>
            </div>
          )}

          <div className="panel">
            <h2>Chi ha in mano cosa</h2>
            <p className="hint">Disponibile = quello che l'associazione ha in mano: incassato (fondo cassa compreso) + prelievi in natura − quanto deve girare alle attività − costi pagati (escluse le voci non ripartite).
              Conguaglio = spettante + fondo cassa da restituire − disponibile: positivo si riceve, negativo si versa. La somma dei conguagli fa sempre zero.</p>
            <table className="tab-cards">
              <thead><tr><th>Associazione</th><th>Incassato</th><th>Prelievi</th><th>Da girare</th><th>Costi</th><th>Disponibile</th><th>Fondo cassa</th><th>Spettante</th><th>Conguaglio</th></tr></thead>
              <tbody>
                {R.enti.map(e => (
                  <tr key={e.ente.id}>
                    <td data-label="Associazione"><b>{e.ente.nome}</b><div className="fin-sub">quota {e.ente.quota}%{e.propri ? " · proprie " + euro(e.propri) : ""}</div></td>
                    <td className="num" data-label="Incassato">{euro(e.incassi)}</td>
                    <td className="num" data-label="Prelievi">{euro(e.prelievi)}</td>
                    <td className="num" data-label="Da girare">{euro(e.daGirare)}</td>
                    <td className="num" data-label="Costi">{euro(e.costi)}</td>
                    <td className="num" data-label="Disponibile">{euro(e.disponibile)}</td>
                    <td className="num" data-label="Fondo cassa">{euro(e.fondi)}</td>
                    <td className="num" data-label="Spettante">{euro(e.spettante)}</td>
                    <td className={"num imp " + (e.conguaglio >= 0 ? "pos" : "neg")} data-label="Conguaglio">{euro(e.conguaglio)}</td>
                  </tr>
                ))}
                {R.enti.length === 0 && <tr><td colSpan="9" className="hint">Crea le associazioni nella scheda "Associazioni".</td></tr>}
              </tbody>
            </table>
            {R.quotaTot !== 100 && R.enti.length > 0 && (
              <p className="hint" style={{ color: "var(--rosso)", marginTop: 8 }}>Attenzione: le quote sommano {R.quotaTot}% invece di 100%.</p>
            )}
          </div>

          <div className="panel">
            <h2>Chi versa a chi</h2>
            <p className="hint">Proposta con il minor numero di bonifici per chiudere i conti; i fondi cassa anticipati sono già compresi.</p>
            {versamenti.length > 0 ? (
              <table className="tab-cards">
                <thead><tr><th>Chi versa</th><th>A chi</th><th>Importo</th></tr></thead>
                <tbody>
                  {versamenti.map((g, i) => (
                    <tr key={i}>
                      <td data-label="Chi versa"><b>{g.da}</b></td>
                      <td data-label="A chi"><b>{g.a}</b></td>
                      <td className="num imp" data-label="Importo"><b>{euro(g.importo)}</b></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : <p className="hint">Nessun versamento da fare: i conti sono già pari.</p>}
            {R.senzaEnte > 0 && <p className="hint" style={{ color: "var(--rosso)", marginTop: 8 }}>
              {R.senzaEnte === 1 ? "1 voce non è intestata" : R.senzaEnte + " voci non sono intestate"} a nessuna associazione: entrano nel risultato ma non nella cassa di nessuno, quindi i versamenti non quadrano finché non le assegni.</p>}
          </div>

          <div className="panel">
            <h2>Controparti</h2>
            <table className="tab-cards">
              <thead><tr><th>Controparte</th><th>Incassato lordo</th><th>Da girare a loro</th><th>Costi verso di loro</th><th>Saldo</th></tr></thead>
              <tbody>
                {R.controparti.map(c => (
                  <tr key={c.id || "nessuno"}>
                    <td data-label="Controparte">{c.id ? nomeSoggetto(c.id) : "(senza controparte)"}</td>
                    <td className="num" data-label="Incassato">{euro(c.incassato)}</td>
                    <td className="num" data-label="Da girare">{euro(c.daGirare)}</td>
                    <td className="num" data-label="Costi">{euro(c.costi)}</td>
                    <td className={"num imp " + (c.id ? "neg" : "muted")} data-label="Saldo">{c.id ? euro(c.daGirare + c.costi) : "—"}</td>
                  </tr>
                ))}
                {R.controparti.length === 0 && <tr><td colSpan="5" className="hint">Ancora nessun movimento.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {sotto === "anagrafica" && (
        <div className="panel">
          <p className="hint">Chi paghiamo o da chi incassiamo: fornitori (Centro Carni, Ghidoni, i DJ…) e attività commerciali come Ciccio o Il Varco.
            Per le attività indica la percentuale dell'incasso che resta alle associazioni: viene proposta in automatico su ogni loro ricavo.</p>
          {soggetti.length > 0 && (
            <table className="tab-cards">
              <thead><tr><th>Nome</th><th>Tipo</th><th>% alle assoc.</th><th>Contatto</th><th></th></tr></thead>
              <tbody>
                {soggetti.map(s => (
                  <tr key={s.id}>
                    <td data-label="Nome">
                      <input value={s.nome} onChange={e => patchSoggetto(s.id, { nome: e.target.value })}
                        onBlur={() => log("ha aggiornato l'anagrafica di " + s.nome)} /></td>
                    <td data-label="Tipo">
                      <select value={s.tipo} onChange={e => patchSoggetto(s.id, { tipo: e.target.value }, "ha aggiornato l'anagrafica di " + s.nome)}>
                        {TIPI_SOGGETTO.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                      </select></td>
                    <td data-label="% alle assoc." className="num">
                      {s.tipo === "attivita"
                        ? <input type="number" min="0" max="100" step="0.5" value={s.retro === undefined ? 100 : s.retro}
                          onChange={e => patchSoggetto(s.id, { retro: e.target.value === "" ? "" : parseFloat(e.target.value) })}
                          onBlur={() => log("ha aggiornato la percentuale di " + s.nome)} />
                        : <span className="imp muted">100%</span>}</td>
                    <td data-label="Contatto">
                      <input value={s.contatto || ""} placeholder="telefono, email…"
                        onChange={e => patchSoggetto(s.id, { contatto: e.target.value })}
                        onBlur={() => log("ha aggiornato l'anagrafica di " + s.nome)} /></td>
                    <td><button className="btn ghost sm" onClick={() => eliminaSoggetto(s.id)}>Elimina</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          {soggetti.length === 0 && <p className="hint">Ancora nessuno in anagrafica.</p>}
          <div className="row" style={{ marginTop: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
            <div className="field"><label>Nome</label>
              <input value={nuovoSoggetto.nome} onChange={e => setNuovoSoggetto(p => ({ ...p, nome: e.target.value }))}
                onKeyDown={e => e.key === "Enter" && aggiungiSoggetto()} placeholder="Es. Centro Carni" /></div>
            <div className="field" style={{ maxWidth: 190 }}><label>Tipo</label>
              <select value={nuovoSoggetto.tipo} onChange={e => setNuovoSoggetto(p => ({ ...p, tipo: e.target.value }))}>
                {TIPI_SOGGETTO.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select></div>
            {nuovoSoggetto.tipo === "attivita" && (
              <div className="field" style={{ maxWidth: 130 }}><label>% alle assoc.</label>
                <input type="number" min="0" max="100" step="0.5" value={nuovoSoggetto.retro}
                  onChange={e => setNuovoSoggetto(p => ({ ...p, retro: e.target.value }))} /></div>
            )}
            <div className="field"><label>Contatto</label>
              <input value={nuovoSoggetto.contatto} onChange={e => setNuovoSoggetto(p => ({ ...p, contatto: e.target.value }))}
                onKeyDown={e => e.key === "Enter" && aggiungiSoggetto()} placeholder="telefono, email…" /></div>
            <button className="btn sm" onClick={aggiungiSoggetto}>Aggiungi</button>
          </div>
        </div>
      )}

      {sotto === "enti" && (
        <div className="panel">
          <p className="hint">Le associazioni che organizzano la festa. La quota è la fetta di risultato che spetta a ciascuna: deve fare 100%.</p>
          <table className="tab-cards">
            <thead><tr><th>Associazione</th><th>Quota %</th><th></th></tr></thead>
            <tbody>
              {enti.map(e => (
                <tr key={e.id}>
                  <td data-label="Associazione"><input value={e.nome} onChange={ev => patchEnte(e.id, { nome: ev.target.value })}
                    onBlur={() => log("ha aggiornato l'associazione " + e.nome)} /></td>
                  <td data-label="Quota %" className="num"><input type="number" min="0" max="100" step="0.01" value={e.quota}
                    onChange={ev => patchEnte(e.id, { quota: ev.target.value === "" ? "" : parseFloat(ev.target.value) })}
                    onBlur={() => log("ha aggiornato la quota di " + e.nome)} /></td>
                  <td><button className="btn ghost sm" onClick={() => eliminaEnte(e.id)}>Elimina</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className={"hint" + (R.quotaTot === 100 ? "" : "")} style={{ marginTop: 8, color: R.quotaTot === 100 ? "var(--verde)" : "var(--rosso)" }}>
            Totale quote: {R.quotaTot}%
          </p>
          <div className="row" style={{ marginTop: 12, alignItems: "flex-end" }}>
            <div className="field"><label>Nuova associazione</label>
              <input value={nuovoEnte} onChange={e => setNuovoEnte(e.target.value)} onKeyDown={e => e.key === "Enter" && aggiungiEnte()} placeholder="Es. Pro Loco" /></div>
            <button className="btn sm" onClick={aggiungiEnte}>Aggiungi</button>
            <button className="btn ghost sm" onClick={quoteParitarie}>Quote uguali</button>
          </div>
        </div>
      )}

      {modaleVoce && (
        <ModaleVoce dati={modaleVoce} soggetti={soggetti} enti={enti}
          onChiudi={() => setModaleVoce(null)} onSalva={salvaVoce} onElimina={eliminaVoce} />
      )}
    </div>
  );
}

/* ---------- Modale voce costo/ricavo ---------- */
function ModaleVoce({ dati, soggetti, enti, onSalva, onElimina, onChiudi }) {
  const [f, setF] = useState(() => ({
    tipo: "costo", voce: "", ente: "", presso: "", soggetto: "", preventivo: 0, consuntivo: "", quotaAssoc: 100, ripartita: true, restituito: false, incluso: false, statoFondo: "", data: "", note: "",
    ...dati,
    quotaAssoc: (dati && dati.quotaAssoc != null) ? dati.quotaAssoc : 100,
    consuntivo: (dati && dati.consuntivo != null) ? dati.consuntivo : ""
  }));
  const [errore, setErrore] = useState("");
  const set = (k, v) => { setErrore(""); setF(p => ({ ...p, [k]: v })); };
  const scegliSoggetto = (id) => {
    const s = soggetti.find(x => x.id === id);
    setF(p => ({ ...p, soggetto: id, quotaAssoc: (s && s.tipo === "attivita" && s.retro !== undefined && s.retro !== "") ? s.retro : p.quotaAssoc }));
  };
  const imp = (f.consuntivo === "" || f.consuntivo === null || f.consuntivo === undefined) ? (parseFloat(f.preventivo) || 0) : (parseFloat(f.consuntivo) || 0);
  const q = Math.min(100, Math.max(0, parseFloat(f.quotaAssoc) || 0));
  return (
    <div className="overlay" onClick={onChiudi}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>{f.id ? "Modifica voce" : "Nuova voce"}</h3>
        <div className="row">
          <div className="field"><label>Tipo</label>
            <select value={f.tipo} onChange={e => set("tipo", e.target.value)}>
              {TIPI_VOCE.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select></div>
          <div className="field"><label>{f.tipo === "prelievo" ? "Chi se lo tiene" : f.tipo === "fondo" ? "Chi ha messo il fondo" : "Associazione"}</label>
            <select value={f.ente} onChange={e => set("ente", e.target.value)}>
              <option value="">— chi paga / incassa —</option>
              {enti.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
            </select></div>
        </div>
        {f.tipo === "prelievo" && (
          <p className="hint" style={{ margin: "0 0 10px" }}>
            Merce della cassa comune che resta a un'associazione (es. un cartone di patatine al Calcio).
            Vale come un suo incasso: nel conguaglio pagherà agli altri la loro parte, tenendosi solo la sua.
          </p>
        )}
        {f.tipo === "fondo" && (
          <div>
            <p className="hint" style={{ margin: "0 0 8px" }}>
              Soldi anticipati per far partire le casse. Non sono né costo né ricavo: tornano a chi li ha messi prima di dividere il resto.
            </p>
            <div className="field"><label>Adesso quei soldi sono in mano a</label>
              <select value={f.presso || f.ente || ""} onChange={e => set("presso", e.target.value)}>
                <option value="">— chi li ha messi —</option>
                {enti.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
              </select></div>
            <label className="check" style={{ margin: "0 0 10px" }}>
              <input type="checkbox" checked={!!f.restituito} onChange={e => set("restituito", e.target.checked)} />
              Già restituito
            </label>
            <label className="check" style={{ margin: "0 0 10px" }}>
              <input type="checkbox" checked={f.statoFondo === "incluso" || f.incluso === true}
                onChange={e => setF(p => ({ ...p, statoFondo: e.target.checked ? "incluso" : "", incluso: e.target.checked }))} />
              È già compreso negli incassi delle casse (contato insieme all'incasso)
            </label>
          </div>
        )}
        {f.tipo !== "fondo" && <div className="field"><label>Controparte</label>
          <select value={f.soggetto} onChange={e => scegliSoggetto(e.target.value)}>
            <option value="">—</option>
            {soggetti.map(s => <option key={s.id} value={s.id}>{s.nome}</option>)}
          </select></div>}
        <div className="field"><label>Voce</label>
          <input autoFocus value={f.voce || ""} onChange={e => set("voce", e.target.value)}
            placeholder={f.tipo === "fondo" ? "Fondo cassa (se lasci vuoto)" : "Es. Carne, Service audio, Incasso bar…"} /></div>
        <div className="row">
          <div className="field"><label>{f.tipo === "fondo" || f.tipo === "prelievo" ? "Previsto (€)" : "Preventivo (€)"}</label>
            <input type="number" step="0.01" min="0" value={f.preventivo} onChange={e => set("preventivo", e.target.value)} /></div>
          <div className="field"><label>Consuntivo (€)</label>
            <input type="number" step="0.01" min="0" value={f.consuntivo} onChange={e => set("consuntivo", e.target.value)} placeholder="non ancora" /></div>
          <div className="field"><label>Data</label>
            <input type="date" value={f.data || ""} onChange={e => set("data", e.target.value)} /></div>
        </div>
        {f.tipo === "ricavo" && (
          <div className="field"><label>% dell'incasso che resta alle associazioni</label>
            <input type="number" step="0.5" min="0" max="100" value={f.quotaAssoc} onChange={e => set("quotaAssoc", e.target.value)} />
            <p className="hint">Su {euro(imp)} restano {euro(imp * q / 100)} alle associazioni e {euro(imp - imp * q / 100)} vanno girati alla controparte. Per gli incassi normali lascia 100.</p>
            {q < 100 && (
              <label className="check" style={{ margin: "6px 0 0" }}>
                <input type="checkbox" checked={f.incluso === true} onChange={e => set("incluso", e.target.checked)} />
                Venduto già compreso negli incassi delle casse (non lo sommo di nuovo, tolgo solo la quota dell'attività)
              </label>
            )}
          </div>
        )}
        {f.tipo !== "fondo" && (
          <label className="check" style={{ margin: "4px 0 10px" }}>
            <input type="checkbox" checked={f.ripartita !== false} onChange={e => set("ripartita", e.target.checked)} />
            Entra nella ripartizione fra le associazioni
          </label>
        )}
        <div className="field"><label>Note</label>
          <textarea value={f.note} onChange={e => set("note", e.target.value)} /></div>
        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn" onClick={() => {
            const nome = String(f.voce || "").trim() || (f.tipo === "fondo" ? "Fondo cassa" : "");
            if (!nome) { setErrore("Scrivi il nome della voce prima di salvare."); return; }
            if (f.tipo === "fondo" && !f.ente) { setErrore("Scegli chi ha messo il fondo cassa."); return; }
            onSalva({
              ...f, voce: nome,
              preventivo: parseFloat(f.preventivo) || 0,
              consuntivo: (f.consuntivo === "" || f.consuntivo === null || f.consuntivo === undefined) ? null : (parseFloat(f.consuntivo) || 0),
              quotaAssoc: f.tipo === "ricavo" ? q : 100,
              ripartita: f.ripartita !== false,
              restituito: f.tipo === "fondo" ? !!f.restituito : false,
              statoFondo: f.tipo === "fondo" ? (f.statoFondo === "incluso" || f.incluso === true ? "incluso" : "") : "",
              incluso: f.tipo === "fondo" ? (f.statoFondo === "incluso" || f.incluso === true) : (f.tipo === "ricavo" && q < 100 ? f.incluso === true : false),
              presso: f.tipo === "fondo" ? (f.presso || f.ente || "") : "",
              creata: f.creata || Date.now()
            });
          }}>Salva</button>
          <button className="btn ghost" onClick={onChiudi}>Annulla</button>
        </div>
        {errore && <p className="hint" style={{ color: "var(--rosso)", marginTop: 8 }}>{errore}</p>}
        {f.id && <button className="btn danger block sm" style={{ marginTop: 8 }}
          onClick={() => { if (confirm("Eliminare la voce \"" + f.voce + "\"?")) onElimina(f.id); }}>Elimina voce</button>}
      </div>
    </div>
  );
}

/* ---------- Sezioni riservate (solo admin) ---------- */
function Permessi({ permessi, utenti, onSalva }) {
  const staff = (utenti || []).filter(u => norm(u.nome) !== ADMIN_USER && u.ruolo !== "admin");
  const set = (k, val, azione) => onSalva({ ...permessi, [k]: val }, azione);
  return (
    <div style={{ marginTop: 10 }}>
      {SEZIONI.filter(s => !s.soloAdmin).map(s => {
        const p = permessi[s.k] || { riservata: false, utenti: [] };
        const aut = p.utenti || [];
        return (
          <div key={s.k} className="sez-perm">
            <div className="sez-perm-top">
              <b>{s.l}</b>
              <label className="check">
                <input type="checkbox" checked={!!p.riservata}
                  onChange={e => set(s.k, { ...p, riservata: e.target.checked, utenti: aut },
                    (e.target.checked ? "ha reso riservata la sezione " : "ha reso libera la sezione ") + s.l)} />
                Riservata
              </label>
            </div>
            {p.riservata && (
              <div>
                <p className="hint" style={{ marginTop: 6 }}>Oltre a te, possono entrare:</p>
                <div className="persone">
                  {staff.length === 0 && <span className="hint">Nessun utente staff ancora creato.</span>}
                  {staff.map(u => {
                    const on = aut.some(n => norm(n) === norm(u.nome));
                    return (
                      <button key={u.nome} className={"chip-perm" + (on ? " on" : "")}
                        onClick={() => set(s.k,
                          { ...p, utenti: on ? aut.filter(n => norm(n) !== norm(u.nome)) : [...aut, u.nome] },
                          (on ? "ha tolto a " : "ha dato a ") + u.nome + " l'accesso a " + s.l)}>
                        {u.nome}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Accesso ---------- */
function Login({ utenti, onEntra }) {
  const [nome, setNome] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");

  const prova = () => {
    const n = norm(nome);
    if (!n) return setErr("Scrivi il tuo nome utente.");
    if (n === ADMIN_USER) {
      if (pw !== ADMIN_PASS) return setErr("Password non corretta.");
      return onEntra({ nome: "admin", ruolo: "admin" });
    }
    const u = utenti.find(x => norm(x.nome) === n);
    if (!u) return setErr("Utente non riconosciuto. Fattelo creare dall'admin.");
    if (norm(pw) !== norm(u.nome)) return setErr("La password è il tuo nome utente.");
    onEntra({ nome: u.nome, ruolo: u.ruolo || "staff" });
  };

  return (
    <div className="login">
      <div className="login-card">
        <h1 className="brand">Vigilia <span>di Natale</span><small>Area e conti</small></h1>
        <div className="field"><label>Nome utente</label>
          <input autoFocus value={nome} onChange={e => { setNome(e.target.value); setErr(""); }}
            onKeyDown={e => e.key === "Enter" && prova()} placeholder="es. gianluca" /></div>
        <div className="field"><label>Password</label>
          <input type="password" value={pw} onChange={e => { setPw(e.target.value); setErr(""); }}
            onKeyDown={e => e.key === "Enter" && prova()} /></div>
        <button className="btn block" style={{ marginTop: 8 }} onClick={prova}>Entra</button>
        {err && <p className="login-err">{err}</p>}
        <p className="hint" style={{ marginTop: 14 }}>La password è uguale al nome utente. Ogni modifica che fai resta firmata con il tuo nome.</p>
      </div>
    </div>
  );
}

/* ---------- Gestione utenti (solo admin) ---------- */
function Utenti({ utenti, onSalva }) {
  const [nuovo, setNuovo] = useState("");
  const [ruolo, setRuolo] = useState("staff");

  const aggiungi = () => {
    const n = nuovo.trim();
    if (!n) return;
    if (utenti.some(u => norm(u.nome) === norm(n)) || norm(n) === ADMIN_USER) return alert("Questo utente esiste già.");
    onSalva([...utenti, { nome: n, ruolo }], "ha creato l'utente " + n + " (" + ruolo + ")");
    setNuovo("");
  };

  return (
    <div>
      <table className="tab-cards">
        <thead><tr><th>Utente</th><th>Password</th><th>Ruolo</th><th></th></tr></thead>
        <tbody>
          {utenti.map(u => (
            <tr key={u.nome}>
              <td data-label="Utente"><b>{u.nome}</b></td>
              <td className="num" data-label="Password">{norm(u.nome) === ADMIN_USER ? ADMIN_PASS : norm(u.nome)}</td>
              <td data-label="Ruolo">{u.ruolo === "admin" ? <span className="ruolo">admin</span> : "staff"}</td>
              <td>
                {norm(u.nome) !== ADMIN_USER && (
                  <button className="btn ghost sm" onClick={() => {
                    if (confirm("Rimuovere l'utente " + u.nome + "?"))
                      onSalva(utenti.filter(x => norm(x.nome) !== norm(u.nome)), "ha rimosso l'utente " + u.nome);
                  }}>Rimuovi</button>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="row" style={{ marginTop: 12, alignItems: "flex-end" }}>
        <div className="field"><label>Nuovo utente</label>
          <input value={nuovo} onChange={e => setNuovo(e.target.value)} onKeyDown={e => e.key === "Enter" && aggiungi()} placeholder="es. gianluca" /></div>
        <div className="field" style={{ maxWidth: 120 }}><label>Ruolo</label>
          <select value={ruolo} onChange={e => setRuolo(e.target.value)}>
            <option value="staff">Staff</option><option value="admin">Admin</option>
          </select></div>
        <button className="btn sm" onClick={aggiungi}>Aggiungi</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
